<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Strata Launcher</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#1d2939"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="low" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- three strata, the lowest drawn first; each slab has a darker front edge for depth -->
  <polygon points="128,150 212,186 212,198 128,234 44,198 44,186" fill="#5b21b6"/>
  <polygon points="128,150 212,186 128,222 44,186" fill="url(#low)"/>
  <polygon points="128,112 212,148 212,160 128,196 44,160 44,148" fill="#1d4ed8"/>
  <polygon points="128,112 212,148 128,184 44,148" fill="url(#mid)"/>
  <polygon points="128,74 212,110 212,122 128,158 44,122 44,110" fill="#0e7490"/>
  <polygon points="128,74 212,110 128,146 44,110" fill="url(#top)"/>
  <!-- the launch mark on the top layer -->
  <polygon points="113,94 151,110 113,126" fill="#ffffff"/>
</svg>
